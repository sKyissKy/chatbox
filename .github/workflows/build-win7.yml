name: Build Windows 7 Packages

on:
  push:
    branches:
      - win7
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - win7
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      build_debug:
        description: 'Build Debug installer as well?'
        type: boolean
        default: true
      runtime_assets_url:
        description: 'Optional custom URL to prebuilt runtime-assets.zip'
        type: string
        default: ''

jobs:
  build-win7:
    name: Build Win7 x64 Installers
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CHATBOX_OUTPUTS_DIR: ${{ github.workspace }}/outputs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: 'pnpm'

      - name: Prepare Win7 Runtime Assets
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\.erb\scripts\prepare-win7-runtime-assets.ps1
        env:
          RUNTIME_ASSETS_ZIP_URL: ${{ inputs.runtime_assets_url }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run Core Tests
        run: |
          pnpm exec vitest run src/shared/utils/reasoning-control.test.ts src/shared/providers/definitions/models/reasoning-request-options.test.ts src/renderer/components/InputBox/ReasoningControlButton.test.tsx src/main/skills/builtin/index.test.ts src/main/debug-logger.test.ts

      - name: Build Application (Main, Preload, Renderer)
        run: pnpm run build

      - name: Package Windows 7 Release Installer
        run: pnpm run build:win7

      - name: Package Windows 7 Debug Installer
        if: github.event_name != 'workflow_dispatch' || inputs.build_debug == true
        run: pnpm run build:win7-debug

      - name: Get App Version
        id: app_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./release/app/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Win7 Release Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Chatbox-${{ steps.app_version.outputs.version }}-Win7-x64-Release-exe
          path: release/*Win7-x64-Setup.exe
          if-no-files-found: error

      - name: Upload Win7 Debug Installer (.exe)
        if: github.event_name != 'workflow_dispatch' || inputs.build_debug == true
        uses: actions/upload-artifact@v4
        with:
          name: Chatbox-${{ steps.app_version.outputs.version }}-Win7-x64-Debug-exe
          path: release/*Win7-x64-Debug-Setup.exe
          if-no-files-found: error
