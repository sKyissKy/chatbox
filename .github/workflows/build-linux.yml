name: Build Linux Packages

on:
  push:
    branches:
      - linux
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - linux
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      build_debug:
        description: 'Build Debug packages as well?'
        type: boolean
        default: true
      runtime_assets_url:
        description: 'Optional custom URL to prebuilt runtime-assets tarball'
        type: string
        default: ''

jobs:
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            deb_arch: amd64
            appimage_arch: x86_64
            os: ubuntu-22.04
          - arch: arm64
            deb_arch: arm64
            appimage_arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CHATBOX_OUTPUTS_DIR: ${{ github.workspace }}/outputs
      NODE_OPTIONS: "--max-old-space-size=8192"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Prepare Linux Runtime Assets
        run: |
          node ./.erb/scripts/prepare-linux-runtime-assets.mjs --arch=${{ matrix.arch }}
        env:
          RUNTIME_ASSETS_TAR_URL: ${{ inputs.runtime_assets_url }}

      - name: Run Core Tests
        run: |
          pnpm exec vitest run src/shared/utils/reasoning-control.test.ts src/shared/providers/definitions/models/reasoning-request-options.test.ts src/renderer/components/InputBox/ReasoningControlButton.test.tsx src/main/skills/builtin/index.test.ts src/main/runtime-env.test.ts

      - name: Build Application (Main, Preload, Renderer)
        run: pnpm run build

      - name: Package Linux (${{ matrix.arch }})
        run: pnpm run build:linux:${{ matrix.arch }}

      - name: Package Linux Debug Edition (${{ matrix.arch }})
        if: github.event_name != 'workflow_dispatch' || inputs.build_debug == true
        run: pnpm run build:linux-debug:${{ matrix.arch }}

      - name: Upload Debian Package (.deb) (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: Chatbox-Linux-${{ matrix.arch }}-deb
          path: release/*linux-${{ matrix.deb_arch }}.deb
          if-no-files-found: error

      - name: Upload AppImage Package (.AppImage) (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: Chatbox-Linux-${{ matrix.arch }}-AppImage
          path: release/*linux-${{ matrix.appimage_arch }}.AppImage
          if-no-files-found: error

      - name: Upload Debug Debian Package (.deb) (${{ matrix.arch }})
        if: github.event_name != 'workflow_dispatch' || inputs.build_debug == true
        uses: actions/upload-artifact@v4
        with:
          name: Chatbox-Linux-${{ matrix.arch }}-Debug-deb
          path: release/*linux-debug-${{ matrix.deb_arch }}.deb
          if-no-files-found: error

      - name: Upload Debug AppImage Package (.AppImage) (${{ matrix.arch }})
        if: github.event_name != 'workflow_dispatch' || inputs.build_debug == true
        uses: actions/upload-artifact@v4
        with:
          name: Chatbox-Linux-${{ matrix.arch }}-Debug-AppImage
          path: release/*linux-debug-${{ matrix.appimage_arch }}.AppImage
          if-no-files-found: error
